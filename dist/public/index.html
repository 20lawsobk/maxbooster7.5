    <!--
      STARTUP SCRIPT — runs before main.tsx hydrates.

      Key techniques from top-tier engineering teams (Vercel, Linear, Notion, Shopify):
        1. Multi-phase progress bar with realistic milestone timing.
        2. Connection quality detection via navigator.connection API.
        3. Early reload prompt at 15s (vs old 60s) — reduces abandonment.
        4. Error boundary: catches uncaught JS errors before React is ready.
        5. After app loads, sends critical chunk URLs to the service worker

      (function() {
        window.__MB_BOOT = Date.now();

        var bar   = document.getElementById('mb-loader-bar-fill');
        var msg   = document.getElementById('mb-loader-msg');
        var sub   = document.getElementById('mb-loader-sub');
        var btn   = document.getElementById('mb-loader-reload');
        var gone  = false;

        if (btn) { btn.addEventListener('click', function() { location.reload(); }); }

        function setProgress(pct) {
          if (bar && !gone) bar.style.width = pct + '%';
        }
        function setMsg(text) {
          if (msg && !gone) msg.textContent = text;
        }
        function setSub(text) {
          if (sub && !gone) sub.textContent = text;
        }
        function showReload() {
          if (btn && !gone) btn.style.display = 'inline-block';
        }

        // Detect if user is on mobile or a slow connection.
        var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        var conn     = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

        // Phase 1: 0 → 3s — initial ramp-up
        setProgress(12);
        setTimeout(function() { setProgress(30); setMsg('Initializing…'); }, 1200);
        setTimeout(function() { setProgress(52); }, 3000);
        setTimeout(function() { setProgress(68); setMsg('Almost ready…'); }, 5500);
        setTimeout(function() { setProgress(82); }, 8000);
        setTimeout(function() { setProgress(91); setMsg('Finishing up…'); }, 11000);

        // Phase 2: slow-connection early warning (8s mobile / 12s desktop)
        var warnMs = isMobile ? 8000 : 12000;
        if (isSlow) warnMs = 5000;

        setTimeout(function() {
          if (gone) return;
          if (isSlow) {
            setSub('Slow connection detected — this may take a moment.');
          } else if (isMobile) {
            setSub('First-time visits cache the app for faster loads next time.');
          }
        }, warnMs);

        // Phase 3: 15s — show reload button (old code waited 60s)
        var reloadMs = isMobile ? 15000 : 20000;
        setTimeout(function() {
          if (gone) return;
          setMsg('Taking a bit longer than usual');
          setSub('Your connection may be slow. Reloading often helps.');
          showReload();
        }, reloadMs);

        // Phase 4: 30s — more prominent message, keep reload button
        setTimeout(function() {
          if (gone) return;
          setMsg('Still loading — hang tight');
          setSub('If this continues, try closing other tabs or switching to Wi-Fi.');
        }, 30000);

        // Global error boundary — catches JS errors before React mounts.
        window.addEventListener('error', function(e) {
          if (document.getElementById('root') && document.getElementById('root').children.length <= 1) {
            var d = document.createElement('div');
            d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;padding:20px;z-index:99999;text-align:center;';
            var inner = document.createElement('div');
            inner.style.cssText = 'max-width:500px';
            var h = document.createElement('h1');
            h.style.cssText = 'font-size:20px;color:#f87171;margin-bottom:12px';
            h.textContent = 'Loading Error';
            var p1 = document.createElement('p');
            p1.style.cssText = 'margin-bottom:8px;font-size:14px;line-height:1.5';
            p1.textContent = e.message || 'Unknown error';
            var p2 = document.createElement('p');
            p2.style.cssText = 'font-size:12px;color:#94a3b8;margin-bottom:16px';
            p2.textContent = (e.filename || '') + (e.lineno ? ':' + e.lineno : '');
            var btn = document.createElement('button');
            btn.style.cssText = 'background:#3b82f6;color:white;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:14px';
            btn.textContent = 'Reload';
            btn.addEventListener('click', function() { location.reload(); });
            inner.appendChild(h); inner.appendChild(p1); inner.appendChild(p2); inner.appendChild(btn);
            d.appendChild(inner);
            document.body.appendChild(d);

        // pre-cache the critical JS/CSS chunks for near-instant repeat visits.

        var observer = new MutationObserver(function() {

            // Measure and log boot time for debugging.
            if (window.__MB_BOOT) {
              var bootMs = Date.now() - window.__MB_BOOT;
              console.log('[MB] App hydrated in ' + bootMs + ' ms');
            }

            // Tell SW to precache the critical chunks so next visit is instant.
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {

                  type: 'PRECACHE_APP_CHUNKS',

      })();
