workflows:
  ios-build:
    name: Max Booster - iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      vars:
        BUNDLE_ID: com.blawzmusic.maxbooster
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        GITHUB_REPO: 20lawsobk/maxbooster7.5
        RELEASE_TAG: ios-latest
      groups:
        - github_credentials
    cache:
      cache_paths:
        - $HOME/.npm
        - ios/App/Pods
    scripts:
      - name: Install Node.js dependencies
        script: npm ci

      - name: Build web assets
        script: NODE_ENV=production SKIP_BOOSTERSTATE=1 npm run build

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        working_directory: ios/App
        script: pod install || pod install --repo-update

      - name: Build iOS archive (unsigned)
        working_directory: ios/App
        script: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO

      - name: Package IPA (unsigned — sideload via AltStore)
        script: |
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -r "$CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app" \
                "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -r "$CM_BUILD_DIR/MaxBooster-iOS.ipa" Payload
          echo "IPA created:"
          ls -lh "$CM_BUILD_DIR/MaxBooster-iOS.ipa"

      - name: Publish IPA to GitHub Releases
        script: |
          IPA="$CM_BUILD_DIR/MaxBooster-iOS.ipa"
          API="https://api.github.com/repos/$GITHUB_REPO"
          AUTH="Authorization: token $GITHUB_PAT"

          # Delete old release with this tag (if it exists)
          OLD_ID=$(curl -sf -H "$AUTH" "$API/releases/tags/$RELEASE_TAG" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -n "$OLD_ID" ]; then
            curl -sf -X DELETE -H "$AUTH" "$API/releases/$OLD_ID" || true
          fi
          curl -sf -X DELETE -H "$AUTH" "$API/git/refs/tags/$RELEASE_TAG" || true

          # Create fresh release
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          RESPONSE=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
            "$API/releases" -d "{
              \"tag_name\": \"$RELEASE_TAG\",
              \"name\": \"Max Booster iOS — $BUILD_DATE\",
              \"body\": \"Unsigned IPA built by Codemagic CI. Install via AltStore or Sideloadly.\",
              \"prerelease\": true
            }")

          UPLOAD_URL=$(echo "$RESPONSE" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])")

          # Upload IPA asset
          curl -sf -X POST \
            -H "$AUTH" \
            -H "Content-Type: application/octet-stream" \
            "${UPLOAD_URL}?name=MaxBooster-iOS.ipa" \
            --data-binary "@$IPA"

          echo "IPA published to GitHub Release: $RELEASE_TAG"

    artifacts:
      - $CM_BUILD_DIR/MaxBooster-iOS.ipa

    publishing:
      email:
        recipients:
          - blawzmusic@gmail.com
        notify:
          success: true
          failure: true
