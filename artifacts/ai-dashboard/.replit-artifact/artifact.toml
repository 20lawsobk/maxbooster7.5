kind = "web"
previewPath = "/"
title = "AI Training Server Dashboard"
version = "1.0.0"
id = "artifacts/ai-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 3000
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/ai-dashboard run dev"

[services.env]
PORT = "3000"
BASE_PATH = "/"

[services.production]
build = "pnpm install && uv sync && pnpm --filter @workspace/api-server run build && BASE_PATH=/ pnpm --filter @workspace/ai-dashboard run build"
# watchdog-dashboard.sh: same bash-loop watchdog as the api-server, but with
# DISABLE_PYTHON_SPAWN=1 so this instance NEVER owns the Python model server.
# NODE_CLUSTER_WORKERS=1 via watchdog script caps RAM to ~512 MB.
run = "bash artifacts/api-server/scripts/watchdog-dashboard.sh"

[services.production.health.startup]
path = "/api/healthz"
