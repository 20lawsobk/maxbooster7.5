[package]
name = "boosterstate"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fxhash = "0.2"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = true
