name: Test Runner

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Test suite to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - security
          - load
          - prelaunch
  schedule:
    - cron: "0 6 * * *"

# Manual + scheduled — collapse duplicate dispatches but let the nightly cron run.
concurrency:
  group: test-runner-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.test_suite == 'security' ||
      github.event.inputs.test_suite == 'all'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maxbooster
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: maxbooster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build web assets
        run: npx tsx script/build.ts
        env:
          NODE_ENV: production
          SKIP_BOOSTERSTATE: "1"

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Run security audit script
        run: npm run security:audit
        env:
          DATABASE_URL: postgresql://maxbooster:testpassword@localhost:5432/maxbooster_test
          SESSION_SECRET: test-secret-do-not-use-in-production-minimum-32-chars
          NODE_ENV: test

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-report
          path: |
            security-report.json
            audit-results.*
          if-no-files-found: ignore
          retention-days: 14

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event.inputs.test_suite == 'load' ||
      github.event.inputs.test_suite == 'all'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maxbooster
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: maxbooster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build web assets
        run: npx tsx script/build.ts
        env:
          NODE_ENV: production
          SKIP_BOOSTERSTATE: "1"

      - name: Start server in background
        run: |
          set -euo pipefail
          node --max-old-space-size=1024 dist/index.mjs &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:5000/api/health >/dev/null 2>&1; then
              echo "✅ Server liveness endpoint responded after ${attempt}s"
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "❌ Server process exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          echo "❌ Server did not start within 60 seconds"
          exit 1
        env:
          DATABASE_URL: postgresql://maxbooster:testpassword@localhost:5432/maxbooster_test
          SESSION_SECRET: test-secret-do-not-use-in-production-minimum-32-chars
          NODE_ENV: test
          PORT: 5000
          DISABLE_CLUSTER: "1"

      - name: Run load tests
        run: npm run test:load
        env:
          DATABASE_URL: postgresql://maxbooster:testpassword@localhost:5432/maxbooster_test
          SESSION_SECRET: test-secret-do-not-use-in-production-minimum-32-chars
          NODE_ENV: test
          TARGET_URL: http://localhost:5000

      - name: Shutdown server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

      - name: Upload load test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: |
            load-test-results.*
            k6-results.*
          if-no-files-found: ignore
          retention-days: 14

  prelaunch-check:
    name: Pre-launch Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.test_suite == 'prelaunch' ||
      github.event.inputs.test_suite == 'all'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maxbooster
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: maxbooster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build web assets
        run: npx tsx script/build.ts
        env:
          NODE_ENV: production
          SKIP_BOOSTERSTATE: "1"

      - name: Run pre-launch checks
        run: npm run prelaunch
        env:
          DATABASE_URL: postgresql://maxbooster:testpassword@localhost:5432/maxbooster_test
          SESSION_SECRET: test-secret-do-not-use-in-production-minimum-32-chars
          NODE_ENV: test

  test-summary:
    name: Test Summary
    needs: [security-tests, load-tests, prelaunch-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Test Runner Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "**Suite:** ${{ github.event.inputs.test_suite }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Load Tests | ${{ needs.load-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-launch Check | ${{ needs.prelaunch-check.result }} |" >> $GITHUB_STEP_SUMMARY

          security_status="${{ needs.security-tests.result }}"
          load_status="${{ needs.load-tests.result }}"
          prelaunch_status="${{ needs.prelaunch-check.result }}"
          expected_suite="${{ github.event.inputs.test_suite }}"

          # A skipped job is acceptable only when the chosen suite intentionally
          # excludes it. This prevents a misconfigured job condition from making
          # the overall workflow green.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            expected_suite="scheduled"
            expected="security=${security_status},load=${load_status},prelaunch=${prelaunch_status}"
            if [[ "$security_status" != "success" || "$prelaunch_status" != "success" || "$load_status" != "skipped" ]]; then
              echo "❌ Unexpected scheduled-suite results: $expected" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            case "$expected_suite" in
              all)
                if [[ "$security_status" != "success" || "$load_status" != "success" || "$prelaunch_status" != "success" ]]; then
                  echo "❌ The all suite requires all jobs to pass; got security=$security_status, load=$load_status, prelaunch=$prelaunch_status" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                ;;
              security)
                if [[ "$security_status" != "success" || "$load_status" != "skipped" || "$prelaunch_status" != "skipped" ]]; then
                  echo "❌ Unexpected security-suite results: security=$security_status, load=$load_status, prelaunch=$prelaunch_status" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                ;;
              load)
                if [[ "$load_status" != "success" || "$security_status" != "skipped" || "$prelaunch_status" != "skipped" ]]; then
                  echo "❌ Unexpected load-suite results: security=$security_status, load=$load_status, prelaunch=$prelaunch_status" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                ;;
              prelaunch)
                if [[ "$prelaunch_status" != "success" || "$security_status" != "skipped" || "$load_status" != "skipped" ]]; then
                  echo "❌ Unexpected prelaunch-suite results: security=$security_status, load=$load_status, prelaunch=$prelaunch_status" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                ;;
              *)
                echo "❌ Unknown test suite: $expected_suite" >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ All required checks for the selected suite passed." >> "$GITHUB_STEP_SUMMARY"
