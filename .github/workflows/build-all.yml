name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v3.1.0) — leave blank for dev build'
        required: false
        default: ''
      desktop_platforms:
        description: 'Desktop platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
      mobile_platforms:
        description: 'Mobile platforms to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios
      build_type:
        description: 'Mobile build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '21'
  APP_NAME: 'Max Booster'
  APP_ID: 'com.blawzmusic.maxbooster'

# Manual workflow only — group by run id so concurrent dispatches don't clobber each other.
concurrency:
  group: build-all-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event.inputs.desktop_platforms == 'linux' ||
      github.event.inputs.desktop_platforms == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm fakeroot dpkg

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Electron process dependencies
        run: npm install --prefix electron --no-audit

      - name: Build web assets
        run: npx tsx script/build.ts
        env:
          NODE_ENV: production
          SKIP_BOOSTERSTATE: '1'

      - name: Remove dangling native module symlinks
        run: find node_modules -maxdepth 5 -name "*.so" -type l ! -exec test -e {} \; -delete 2>/dev/null || true

      - name: Build Linux packages
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build outputs
        run: |
          echo "=== Linux Build Outputs ==="
          find dist-installers -type f 2>/dev/null || echo "No outputs found"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist-installers/*.AppImage
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist-installers/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist-installers/*.tar.gz
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    if: >-
      github.event.inputs.desktop_platforms == 'windows' ||
      github.event.inputs.desktop_platforms == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Electron process dependencies
        shell: bash
        run: npm install --prefix electron --no-audit

      - name: Build web assets
        run: npx tsx script/build.ts
        env:
          NODE_ENV: production
          SKIP_BOOSTERSTATE: '1'

      - name: Build Windows packages
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build outputs
        run: |
          echo "=== Windows Build Outputs ==="
          Get-ChildItem -Path dist-installers -Recurse -File | Select-Object FullName, Length
        shell: pwsh

      - name: Upload Windows NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: dist-installers/*Setup*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist-installers/*.exe
            !dist-installers/*Setup*.exe
          if-no-files-found: warn
          retention-days: 14

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    if: >-
      github.event.inputs.desktop_platforms == 'macos' ||
      github.event.inputs.desktop_platforms == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Electron process dependencies
        run: npm install --prefix electron --no-audit

      - name: Build web assets
        run: npx tsx script/build.ts
        env:
          NODE_ENV: production
          SKIP_BOOSTERSTATE: '1'

      - name: Build macOS packages
        run: npx electron-builder --mac zip --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build outputs
        run: |
          echo "=== macOS Build Outputs ==="
          find dist-installers -type f 2>/dev/null || echo "No outputs found"

      # See note in build-desktop.yml — exclude arm64 from the x64 bucket so
      # the same arm64 zip is not uploaded into both artifacts (which would
      # cause name collisions in `action-gh-release`).
      - name: Upload macOS ZIP (Intel x64)
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip-x64
          path: |
            dist-installers/*mac*.zip
            !dist-installers/*arm64*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload macOS ZIP (Apple Silicon arm64)
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip-arm64
          path: dist-installers/*arm64*.zip
          if-no-files-found: warn
          retention-days: 14

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event.inputs.mobile_platforms == 'android' ||
      github.event.inputs.mobile_platforms == 'both'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npx tsx script/build.ts
        env:
          NODE_ENV: production
          SKIP_BOOSTERSTATE: '1'

      - name: Copy logo assets into web dir
        run: |
          cp client/public/logo.png dist/public/logo.png 2>/dev/null || true
          cp client/public/favicon.png dist/public/favicon.png 2>/dev/null || true

      - name: Remove pre-compressed gz duplicates
        run: find dist/public -name "*.gz" -delete

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Android Signing
        id: android_signing
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::warning::No Android keystore provided, release build will be unsigned"
            echo "ANDROID_SIGNING_CONFIGURED=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

          cat > android/keystore.properties << EOF
          storeFile=../release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

          cat > android/app/signing.gradle << 'GRADLE'
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              def keystoreProperties = new Properties()
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

              android {
                  signingConfigs {
                      release {
                          storeFile file(keystoreProperties['storeFile'].trim())
                          storePassword keystoreProperties['storePassword'].trim()
                          keyAlias keystoreProperties['keyAlias'].trim()
                          keyPassword keystoreProperties['keyPassword'].trim()
                      }
                  }
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }
          GRADLE

          if ! grep -q "signing.gradle" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply from: 'signing.gradle'" >> android/app/build.gradle
          fi

          echo "ANDROID_SIGNING_CONFIGURED=true" >> $GITHUB_OUTPUT
          echo "Android signing configured successfully"

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Android Release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Android App Bundle (AAB)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: List build outputs
        run: |
          echo "=== Debug APK ==="
          find android -name "*.apk" -path "*/debug/*" 2>/dev/null || echo "No debug APK found"
          echo "=== Release APK ==="
          find android -name "*.apk" -path "*/release/*" 2>/dev/null || echo "No release APK found"
          echo "=== App Bundle ==="
          find android -name "*.aab" 2>/dev/null || echo "No AAB found"

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android Release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android App Bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

  # See note in build-mobile.yml: iOS IPA is a manual macOS step.
  build-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >-
      github.event.inputs.mobile_platforms == 'ios' ||
      github.event.inputs.mobile_platforms == 'both'
    steps:
      - name: iOS build summary (manual step required)
        run: |
          {
            echo "## iOS Build"
            echo ""
            echo "IPA compilation requires macOS + Xcode and is not run in CI."
            echo ""
            echo "**Local build:**"
            echo '```bash'
            echo "npm ci"
            echo "npm run build"
            echo "npx cap sync ios"
            echo "open ios/App/App.xcworkspace"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::iOS builds require macOS + Xcode. Build locally — see job summary."

  create-release:
    # iOS excluded from `needs` — no IPA artifact is produced.
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      always() &&
      github.event.inputs.version_tag != '' &&
      (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' ||
       needs.build-macos.result == 'success' || needs.build-android.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "${{ env.APP_NAME }} ${{ github.event.inputs.version_tag }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.event.inputs.version_tag, 'alpha') || contains(github.event.inputs.version_tag, 'beta') || contains(github.event.inputs.version_tag, 'rc') }}
          # iOS IPA is built/uploaded manually on macOS via Transporter.
          files: |
            artifacts/linux-appimage/*.AppImage
            artifacts/linux-deb/*.deb
            artifacts/linux-tarball/*.tar.gz
            artifacts/windows-nsis-installer/*.exe
            artifacts/windows-portable/*.exe
            artifacts/macos-zip-x64/*.zip
            artifacts/macos-zip-arm64/*.zip
            artifacts/android-release-apk/*.apk
            artifacts/android-app-bundle/*.aab
          body: |
            ## ${{ env.APP_NAME }} ${{ github.event.inputs.version_tag }}

            ### What's New
            - Platform-adaptive Lyrics Panel (docked on desktop, full-screen overlay on mobile)
            - Platform-adaptive Audio Device Management (full enumeration on desktop, permission-based on mobile)
            - Native Electron fullscreen (uses OS window fullscreen, not browser fullscreen API)
            - Mobile-optimized touch targets and layouts throughout the DAW

            ### Desktop Downloads
            | Platform | Format | Notes |
            |----------|--------|-------|
            | Windows | NSIS Installer / Portable | Run installer or portable .exe |
            | macOS | ZIP (x64 + arm64) | Extract and run, or drag to Applications |
            | Linux | AppImage / DEB / tar.gz | `chmod +x *.AppImage` to run |

            ### Mobile Downloads
            | Platform | Format | Notes |
            |----------|--------|-------|
            | Android | APK | Enable "Install from unknown sources" |
            | Android | AAB | Upload to Google Play internal testing |
            | iOS | IPA | Use Apple Transporter for App Store Connect |

            See the automatically generated release notes below for full details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Max Booster — All Platform Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Desktop" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mobile" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.build-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Linux AppImage / DEB / tar.gz (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows NSIS Installer / Portable (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS ZIP x64 + arm64 (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Android Debug APK (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Android Release APK / AAB (30 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform-Adaptive Features" >> $GITHUB_STEP_SUMMARY
          echo "- Lyrics Panel: docked on desktop, full-screen overlay on mobile" >> $GITHUB_STEP_SUMMARY
          echo "- Audio Devices: full Web Audio API enumeration on desktop/Electron, permission-based on mobile" >> $GITHUB_STEP_SUMMARY
          echo "- Fullscreen: native Electron window API on desktop, browser Fullscreen API on web" >> $GITHUB_STEP_SUMMARY
