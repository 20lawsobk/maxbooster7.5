name: Build Desktop Apps

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

env:
  NODE_VERSION: '20'
  APP_NAME: 'Max Booster'
  APP_ID: 'com.blawzmusic.maxbooster'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'linux' ||
      github.event.inputs.platform == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Linux packages
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build outputs
        run: |
          echo "=== Linux Build Outputs ==="
          find dist-installers -type f 2>/dev/null || echo "No outputs found"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist-installers/*.AppImage
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist-installers/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist-installers/*.tar.gz
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'windows' ||
      github.event.inputs.platform == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Windows packages
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build outputs
        run: |
          echo "=== Windows Build Outputs ==="
          Get-ChildItem -Path dist-installers -Recurse -File | Select-Object FullName, Length
        shell: pwsh

      - name: Upload Windows NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: dist-installers/*Setup*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist-installers/*.exe
            !dist-installers/*Setup*.exe
          if-no-files-found: warn
          retention-days: 14

  build-macos:
    runs-on: macos-14
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'macos' ||
      github.event.inputs.platform == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup macOS Code Signing
        id: mac_signing
        if: secrets.MAC_CERTIFICATE_BASE64 != ''
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$MAC_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "MAC_SIGNING_CONFIGURED=true" >> $GITHUB_OUTPUT
          echo "macOS signing configured successfully"

      - name: Build macOS packages
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: List build outputs
        run: |
          echo "=== macOS Build Outputs ==="
          find dist-installers -type f 2>/dev/null || echo "No outputs found"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist-installers/*.dmg
          if-no-files-found: warn
          retention-days: 14

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist-installers/*.zip
          if-no-files-found: warn
          retention-days: 14

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: |
          echo "=== All artifacts ==="
          find artifacts -type f | sort

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-nsis-installer/*.exe
            artifacts/windows-portable/*.exe
            artifacts/macos-dmg/*.dmg
            artifacts/macos-zip/*.zip
            artifacts/linux-appimage/*.AppImage
            artifacts/linux-deb/*.deb
            artifacts/linux-tarball/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          name: "${{ env.APP_NAME }} v${{ steps.version.outputs.VERSION }}"
          body: |
            ## ${{ env.APP_NAME }} v${{ steps.version.outputs.VERSION }}

            ### Desktop Downloads

            #### Windows
            - **NSIS Installer**: Full installer with options
            - **Portable**: Run without installation

            #### macOS
            - **DMG**: Disk image installer
            - **ZIP**: Compressed archive

            #### Linux
            - **AppImage**: Universal Linux package
            - **DEB**: Debian/Ubuntu package
            - **tar.gz**: Compressed archive

            ### Installation Instructions

            **Windows:**
            1. Download the Setup .exe installer
            2. Run the installer and follow prompts
            3. Or download Portable .exe for no-install version

            **macOS:**
            1. Download the .dmg file
            2. Open and drag Max Booster to Applications
            3. If prompted about unverified developer, go to System Preferences > Security

            **Linux:**
            1. Download AppImage, make executable: `chmod +x *.AppImage`
            2. Or install .deb: `sudo dpkg -i *.deb`

            ### What's New
            See the automatically generated release notes below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-summary:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Desktop Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Windows NSIS Installer (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows Portable (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS DMG (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS ZIP (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Linux AppImage (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Linux DEB (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Linux tar.gz (14 day retention)" >> $GITHUB_STEP_SUMMARY
