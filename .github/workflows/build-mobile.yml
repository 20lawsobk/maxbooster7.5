name: Build Mobile Apps

on:
  push:
    branches:
      - main
      - "release/**"
      - "deploy/**"
    tags:
      - "v*"
  deployment:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "both"
        type: choice
        options:
          - ios
          - android
          - both
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: "21"
  APP_NAME: "Max Booster"
  APP_ID: "com.blawzmusic.maxbooster"

# Cancel superseded mobile builds; keep tag runs intact.
concurrency:
  group: build-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# Read-only by default; create-release & Play upload jobs opt in below.
permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'deployment' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'both'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build web assets
        run: npx tsx script/build.ts
        env:
          NODE_ENV: production
          SKIP_BOOSTERSTATE: "1"

      - name: Copy logo assets into web dir
        run: |
          cp client/public/logo.png dist/public/logo.png 2>/dev/null || true
          cp client/public/favicon.png dist/public/favicon.png 2>/dev/null || true

      - name: Remove pre-compressed gz duplicates
        run: find dist/public -name "*.gz" -delete

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Android Signing
        id: android_signing
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::warning::No Android keystore provided, release build will be unsigned"
            echo "ANDROID_SIGNING_CONFIGURED=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

          cat > android/keystore.properties << EOF
          storeFile=../release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

          cat > android/app/signing.gradle << 'GRADLE'
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              def keystoreProperties = new Properties()
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

              android {
                  signingConfigs {
                      release {
                          storeFile file(keystoreProperties['storeFile'].trim())
                          storePassword keystoreProperties['storePassword'].trim()
                          keyAlias keystoreProperties['keyAlias'].trim()
                          keyPassword keystoreProperties['keyPassword'].trim()
                      }
                  }
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }
          GRADLE

          if ! grep -q "signing.gradle" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply from: 'signing.gradle'" >> android/app/build.gradle
          fi

          echo "ANDROID_SIGNING_CONFIGURED=true" >> $GITHUB_OUTPUT
          echo "Android signing configured successfully"

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Android Release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Android App Bundle (AAB)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: List build outputs
        run: |
          echo "=== Debug APK ==="
          find android -name "*.apk" -path "*/debug/*" 2>/dev/null || echo "No debug APK found"
          echo "=== Release APK ==="
          find android -name "*.apk" -path "*/release/*" 2>/dev/null || echo "No release APK found"
          echo "=== App Bundle ==="
          find android -name "*.aab" 2>/dev/null || echo "No AAB found"

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android Release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android App Bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

  # iOS IPA builds require macOS + Xcode and are produced locally; this job is
  # intentionally a lightweight notice. We skip the previous wasteful pattern
  # of checkout + npm ci + web build that always ended in "iOS not supported".
  build-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'deployment' ||
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'both'
    steps:
      - name: iOS build summary (manual step required)
        run: |
          {
            echo "## iOS Build"
            echo ""
            echo "IPA compilation requires macOS + Xcode and is not run in CI."
            echo ""
            echo "**Local build:**"
            echo '```bash'
            echo "npm ci"
            echo "npm run build"
            echo "npx cap sync ios"
            echo "open ios/App/App.xcworkspace"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::iOS builds require macOS + Xcode. Build locally — see job summary."

  upload-to-play-store:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-android.result == 'success'
    steps:
      - name: Download Android App Bundle
        uses: actions/download-artifact@v4
        with:
          name: android-app-bundle
          path: android-bundle

      - name: List downloaded files
        run: ls -la android-bundle/

      - name: Check Play Store credentials
        id: play_store_check
        run: |
          if [ -z "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "::warning::Google Play service account not configured, skipping upload"
            echo "PLAY_STORE_CONFIGURED=false" >> $GITHUB_OUTPUT
          else
            echo "PLAY_STORE_CONFIGURED=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Google Play (Internal Testing)
        if: steps.play_store_check.outputs.PLAY_STORE_CONFIGURED == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_ID }}
          releaseFiles: android-bundle/*.aab
          track: internal
          status: draft
          whatsNewDirectory: .github/whatsnew

  create-release:
    # iOS is intentionally not in `needs:` because no IPA is produced in CI;
    # gating on it would either always-fail or always-pass for the wrong reason.
    needs: [build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-android.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: |
          echo "=== All artifacts ==="
          find artifacts -type f | sort

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # iOS IPA is built locally on macOS and uploaded out-of-band via Transporter.
          files: |
            artifacts/android-release-apk/*.apk
            artifacts/android-app-bundle/*.aab
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          name: "${{ env.APP_NAME }} v${{ steps.version.outputs.VERSION }}"
          body: |
            ## ${{ env.APP_NAME }} v${{ steps.version.outputs.VERSION }}

            ### Mobile Downloads

            #### Android
            - **APK**: Direct install (sideloading)
            - **AAB**: Google Play Store upload

            #### iOS
            - iOS IPAs are not produced in CI (Xcode + macOS required). Build locally:
              `npm ci && npm run build && npx cap sync ios && open ios/App/App.xcworkspace`

            ### Installation Instructions

            **Android APK:**
            1. Download the APK file
            2. Enable "Install from unknown sources" in settings
            3. Open the APK to install

            **Android (Play Store):**
            The AAB is automatically uploaded to the internal testing track.

            **iOS:**
            1. On a Mac with Xcode 15+, run: `npm ci && npm run build && npx cap sync ios`
            2. Open `ios/App/App.xcworkspace` in Xcode and Archive
            3. Use Apple Transporter to upload the IPA to App Store Connect
            4. Submit for TestFlight or App Store review

            ### What's New
            See the automatically generated release notes below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-summary:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Mobile Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.build-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Android Debug APK (14 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Android Release APK (30 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Android App Bundle - AAB (30 day retention)" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: not built in CI (manual macOS + Xcode required)" >> $GITHUB_STEP_SUMMARY
