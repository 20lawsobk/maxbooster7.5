name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

# Cancel in-flight CI runs for the same ref when a newer commit arrives.
# `pull_request` events use `head_ref`; `push` events use `ref`.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Default to read-only token; individual jobs that need more must opt in.
permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript type check
        run: npm run check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint (warnings allowed, errors fail)
        # --max-warnings is intentionally large during the rollout. Ratchet
        # this down as type-erosion (`as any`) and console.log usage are
        # cleaned up. The job still hard-fails on any rule classified as error.
        run: npx eslint . --max-warnings=99999 || true

      - name: ESLint hard gate (errors only)
        run: npx eslint . --quiet

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:ci
        env:
          NODE_ENV: test
          SESSION_SECRET: ci-test-session-secret-minimum-32-chars-xxxx
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maxbooster_test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npx tsx script/build.ts
        env:
          NODE_ENV: production
          SKIP_BOOSTERSTATE: '1'

      - name: Verify build output
        run: |
          echo "=== Build Outputs ==="
          ls -lh dist/public/ 2>/dev/null || echo "No dist/public found"
          ls -lh dist/*.js 2>/dev/null || echo "No dist JS files found"
          echo "=== Checking index.html ==="
          test -f dist/public/index.html && echo "✅ index.html present" || echo "❌ index.html missing"
          echo "=== Checking server bundle ==="
          test -f dist/index.js && echo "✅ Server bundle present" || echo "❌ Server bundle missing"

      - name: Upload build artifacts (for inspection)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-dist
          path: |
            dist/public/index.html
            dist/index.js
          if-no-files-found: warn
          retention-days: 3

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NOTE: this job IS a hard gate — the parsing step below exits 1 on
    # high/critical findings. Do not re-add `continue-on-error: true`.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run npm audit (high severity and above)
        # `npm audit` returns non-zero when vulns exist; capture JSON either way
        # and let the next step decide whether to fail.
        run: npm audit --audit-level=high --json > audit-report.json || true

      - name: Parse and display audit results
        run: |
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
            const vulns = report.metadata?.vulnerabilities ?? {};
            const total = Object.values(vulns).reduce((a, b) => a + b, 0);
            console.log('== npm audit summary ==');
            Object.entries(vulns).forEach(([sev, count]) => {
              if (count > 0) console.log(\`  \${sev}: \${count}\`);
            });
            const highPlus = (vulns.high ?? 0) + (vulns.critical ?? 0);
            if (highPlus > 0) {
              console.error(\`❌ \${highPlus} high/critical vulnerabilities found\`);
              process.exit(1);
            } else {
              console.log('✅ No high/critical vulnerabilities');
            }
          "

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 7

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maxbooster_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maxbooster_test
      SESSION_SECRET: ci-integration-session-secret-minimum-32-chars-xxxx
      STRIPE_SECRET_KEY: sk_test_placeholder_for_ci_only_not_real
      PORT: 5001
      CI: 'true'
      TEST_BASE_URL: http://localhost:5001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Push database schema
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maxbooster_test

      - name: Start server in background
        run: |
          npx tsx server/index.ts &
          echo $! > /tmp/server.pid
          echo "Server started with PID $(cat /tmp/server.pid)"

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server on port 5001..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/health > /dev/null 2>&1; then
              echo "✅ Server is ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Server did not start within 30s"
              cat /tmp/server.pid | xargs kill 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

      - name: Run integration tests (health + auth guards)
        run: npm run test:integration:ci

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi

      - name: Upload integration test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: test-results-integration.xml
          retention-days: 7

  ci-summary:
    name: CI Summary
    needs: [typecheck, lint, test, build, security, test-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.test-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.typecheck.result }}" == "success" && "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" && "${{ needs.test-integration.result }}" == "success" && "${{ needs.build.result }}" == "success" && "${{ needs.security.result }}" == "success" ]]; then
            echo "✅ All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ One or more checks failed" >> $GITHUB_STEP_SUMMARY
          fi
