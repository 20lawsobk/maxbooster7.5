model:
  in_ch: 3
  base_ch: 128
  ch_mult: [1, 2, 4, 4]
  temporal_down: [1, 2, 2, 2]
  latent_ch: 16

data:
  root: /data/video_dataset
  n_frames: 16
  height: 256
  width: 256
  flip_prob: 0.5
  color_jitter: true

train:
  total_steps: 300000
  batch_size: 4
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 0.01
  kl_weight: 1.0e-6
  warmup_steps: 2000
  log_every: 100
  ckpt_every: 5000
  out_dir: checkpoints/autoencoder
  resume: ""
