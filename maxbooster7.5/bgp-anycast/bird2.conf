router id REPLACE_WITH_ROUTER_ID;

protocol device {
}

protocol direct {
    interface "anycast0";
}

protocol kernel {
    ipv4 {
        export all;
    };
}

# Filter to only export the anycast prefix
filter anycast_filter {
    if proto = "direct" then accept;
    reject;
}

protocol bgp upstream {
    local as MY_ASN;
    neighbor UPSTREAM_IP as UPSTREAM_ASN;
    
    ipv4 {
        import none;
        export filter anycast_filter;
    };
}
