# UV configuration — project-level settings.
# All Python packages for the port-8008 diffusion server are installed
# separately by build.sh into python_runtime/ using the portable CPython
# binary from python-build-standalone — NOT via uv/pip into the Nix store.

# Only use system Python — do not download a new interpreter.
python-preference = "only-system"

# Never auto-download Python interpreters.
python-downloads = "never"
