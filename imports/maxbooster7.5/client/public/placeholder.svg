<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Image placeholder">
  <title>Image placeholder</title>
  <style>
    :root { --placeholder-bg: #f3f4f6; --placeholder-fg: #9ca3af; --placeholder-text: #6b7280; }
    @media (prefers-color-scheme: dark) {
      :root { --placeholder-bg: #1f2430; --placeholder-fg: #4b5563; --placeholder-text: #6b7280; }
    }
  </style>
  <rect fill="var(--placeholder-bg, #f3f4f6)" width="400" height="300"/>
