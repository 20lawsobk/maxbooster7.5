[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
# Dependencies intentionally empty — all Python packages needed by the port
# 8008 diffusion server (numpy, fastapi, uvicorn, pydantic) are installed by
# build.sh into python_runtime/ using the portable CPython binary.
# Keeping this list empty ensures `uv sync` is truly a no-op and never
# tries to write to the read-only Nix store during the deployment build phase.
dependencies = [
    "fastapi>=0.136.0",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "pydantic>=2.13.2",
    "scipy>=1.17.1",
    "uvicorn>=0.44.0",
]

[tool.uv]
# Do not treat this project as an installable package.
# Makes `uv sync` a true no-op (nothing to install, nothing to build).
package = false
