[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
# Shared root Python support dependencies for local API, HTTP/security, and test
# tooling. Packaged services use their own runtime manifests; deployment does
# not derive the portable Python runtime from this root dependency list.
dependencies = [
    "anyio>=4.14.2,<5",
    "certifi>=2026.10.18",
    "fastapi>=0.100.0",
    "fsspec>=2026.6.0",
    # Test-only transport required by Starlette TestClient.
    "httpx2==2.14.0",
    "h11>=0.16.0",
    "numpy>=1.24.0",
    "pillow>=13.0.0",
    "pydantic>=2.0.0",
    "scipy>=1.11.0",
    "starlette>=1.3.1",
    "urllib3>=2.8.0,<3",
    "uvicorn[standard]>=0.23.0",
    "volare>=0.20.6",
    "pytest==9.1.1",
    "coverage>=7.13,<8",
    "py>=1.11,<2",
]

[tool.uv]
# Do not build or install this workspace as a package. `uv sync` still
# resolves and installs the declared dependencies.
package = false
