<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Max Booster</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="theme-color" content="#0a0a0f" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
        background:
          radial-gradient(
            1200px 600px at 50% -10%,
            rgba(74, 158, 255, 0.18),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 80% 110%,
            rgba(102, 126, 234, 0.2),
            transparent 60%
          ),
          linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f0f0f5;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .container {
        text-align: center;
        max-width: 460px;
        width: 100%;
      }
      .logo-wrap {
        width: 96px;
        height: 96px;
        margin: 0 auto 28px;
        border-radius: 24px;
        background: linear-gradient(
          135deg,
          rgba(74, 158, 255, 0.18) 0%,
          rgba(102, 126, 234, 0.18) 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
        box-shadow:
          0 12px 40px rgba(74, 158, 255, 0.25),
          inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        position: relative;
      }
      .logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 4px 12px rgba(74, 158, 255, 0.45));
      }
      .status-dot {
        position: absolute;
        bottom: 4px;
        right: 4px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ef4444;
        border: 3px solid #0a0a0f;
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
        animation: pulse 2s infinite;
      }
      .status-dot.online {
        background: #10b981;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
        }
        70% {
          box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #4a9eff 0%, #667eea 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
      }
      p.subtitle {
        color: #a0a0b0;
        line-height: 1.6;
        margin-bottom: 24px;
        font-size: 15px;
      }
      .pending {
        display: none;
        margin: 0 auto 24px;
        padding: 14px 18px;
        background: rgba(74, 158, 255, 0.08);
        border: 1px solid rgba(74, 158, 255, 0.25);
        border-radius: 12px;
        color: #c8d6ff;
        font-size: 14px;
        line-height: 1.5;
        text-align: left;
      }
      .pending.visible {
        display: block;
      }
      .pending strong {
        color: #4a9eff;
        font-weight: 600;
      }
      .pending .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .pending .row + .row {
        margin-top: 6px;
      }
      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        background: linear-gradient(135deg, #4a9eff 0%, #667eea 100%);
        color: white;
        border: none;
        padding: 13px 26px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease,
          box-shadow 0.15s ease;
        box-shadow: 0 6px 18px rgba(74, 158, 255, 0.35);
      }
      .btn:hover {
        opacity: 0.92;
        box-shadow: 0 8px 22px rgba(74, 158, 255, 0.45);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.secondary {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: none;
        color: #d0d0e0;
      }
      .btn.secondary:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .footer {
        margin-top: 28px;
        font-size: 12px;
        color: #60607a;
      }
      .footer span#net-label {
        color: #a0a0b0;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-wrap" aria-hidden="true">
        <img
          class="logo"
          src="/logo.png"
          alt="Max Booster"
          onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('beforeend', '<div style=&quot;font-size:44px;line-height:1;&quot;>🎵</div>');"
        />
        <span id="status-dot" class="status-dot" title="Offline"></span>
      </div>

      <h1 id="title">You're Offline</h1>
      <p class="subtitle" id="subtitle">
        We can't reach Max Booster right now. Your work is safe — anything you
        do will be saved on this device and synced automatically when you're
        back online.
      </p>

      <div class="pending" id="pending">
        <div class="row">
          <span>Changes waiting to sync</span
          ><strong id="pending-count">0</strong>
        </div>
        <div class="row">
          <span>Cached pages available</span><strong id="cache-count">0</strong>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="retry-btn" onclick="retry()">Try Again</button>
        <button
          class="btn secondary"
          onclick="history.length > 1 ? history.back() : location.assign('/')"
        >
          Go Back
        </button>
      </div>

      <div class="footer">
        Status: <span id="net-label">Offline</span> ·
        <span id="last-check">checking…</span>
      </div>
    </div>

    <script>
      (function () {
        var titleEl = document.getElementById("title");
        var subEl = document.getElementById("subtitle");
        var dotEl = document.getElementById("status-dot");
        var labelEl = document.getElementById("net-label");
        var lastCheck = document.getElementById("last-check");
        var retryBtn = document.getElementById("retry-btn");
        var pendingBox = document.getElementById("pending");
        var pendingEl = document.getElementById("pending-count");
        var cacheEl = document.getElementById("cache-count");

        function setOnline(isOn) {
          if (isOn) {
            dotEl.classList.add("online");
            dotEl.title = "Online";
            labelEl.textContent = "Online";
            titleEl.textContent = "You're Back Online";
            subEl.textContent = "Reconnecting and syncing your changes…";
            retryBtn.textContent = "Continue";
            setTimeout(function () {
              location.assign("/");
            }, 800);
          } else {
            dotEl.classList.remove("online");
            dotEl.title = "Offline";
            labelEl.textContent = "Offline";
          }
        }

        window.retry = function () {
          retryBtn.disabled = true;
          retryBtn.textContent = "Checking…";
          // HEAD request to a tiny endpoint to verify real connectivity (navigator.onLine lies).
          fetch("/api/health", { method: "HEAD", cache: "no-store" })
            .then(function (r) {
              if (r && (r.ok || r.status === 401 || r.status === 404)) {
                setOnline(true);
              } else {
                throw new Error("not ok");
              }
            })
            .catch(function () {
              retryBtn.disabled = false;
              retryBtn.textContent = "Try Again";
              lastCheck.textContent =
                "last check: " + new Date().toLocaleTimeString();
            });
        };

        // Auto-detect when connection comes back.
        window.addEventListener("online", function () {
          setOnline(true);
        });
        setOnline(navigator.onLine && false); // start in offline visual state

        // Read pending offline-queue size from IndexedDB if possible.
        // The OfflineQueue module uses an IDB database — we open it read-only.
        function readPending() {
          try {
            var req = indexedDB.open("max-booster-offline", 1);
            req.onsuccess = function () {
              var db = req.result;
              if (!db.objectStoreNames.contains("queue")) {
                db.close();
                return;
              }
              try {
                var tx = db.transaction("queue", "readonly");
                var store = tx.objectStore("queue");
                var countReq = store.count();
                countReq.onsuccess = function () {
                  var n = countReq.result || 0;
                  if (n > 0) {
                    pendingEl.textContent = String(n);
                    pendingBox.classList.add("visible");
                  }
                };
                countReq.onerror = function () {
                  db.close();
                };
                tx.oncomplete = function () {
                  db.close();
                };
              } catch (_) {
                db.close();
              }
            };
            req.onerror = function () {
              /* IDB not available */
            };
          } catch (_) {
            /* ignore */
          }
        }

        // Count cached pages from the service worker cache.
        function readCacheCount() {
          if (!("caches" in window)) return;
          caches
            .keys()
            .then(function (names) {
              var shellNames = names.filter(function (n) {
                return n.indexOf("max-booster-shell") === 0;
              });
              if (shellNames.length === 0) return;
              return caches.open(shellNames[0]).then(function (cache) {
                return cache.keys().then(function (keys) {
                  if (keys.length > 0) {
                    cacheEl.textContent = String(keys.length);
                    pendingBox.classList.add("visible");
                  }
                });
              });
            })
            .catch(function () {
              /* ignore */
            });
        }

        readPending();
        readCacheCount();
        lastCheck.textContent =
          "last check: " + new Date().toLocaleTimeString();

        // Background poll every 10s — if connectivity returns, redirect.
        setInterval(function () {
          if (!navigator.onLine) return;
          fetch("/api/health", { method: "HEAD", cache: "no-store" })
            .then(function (r) {
              if (r && (r.ok || r.status === 401 || r.status === 404))
                setOnline(true);
            })
            .catch(function () {
              /* still offline */
            });
        }, 10000);
      })();
    </script>
  </body>
</html>
